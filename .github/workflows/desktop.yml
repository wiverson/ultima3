# Builds the desktop app (desktop/, Electron) for Windows, macOS and Linux
# and the Android app (mobile/, Capacitor), then publishes them as a GitHub
# Release. Every push to main that changes the game or an app is a release:
# its version is the major.minor from desktop/package.json with the run
# number as the patch (1.0.37, say), so nothing is versioned by hand. To
# start a new series, change that major.minor. A manual run does the same.
# Desktop builds are unsigned: see the README's Desktop section for what
# that means on each platform. The APK is signed with the committed sideload
# key unless the ANDROID_KEYSTORE_* secrets provide a release key.
name: Desktop and Android builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', 'mobile/**', 'web/**', '.github/workflows/desktop.yml']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: echo "version=$(node -p "require('./desktop/package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm version --no-git-tag-version "${{ needs.version.outputs.version }}"
        working-directory: desktop
      - run: npm run bundle
        working-directory: desktop
      - run: npx electron-builder --${{ matrix.target }} --publish never
        working-directory: desktop
        env:
          # Unsigned macOS builds: skip the notarisation step electron-builder would otherwise attempt.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v7
        with:
          name: ultima3-${{ matrix.target }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: mobile
      - run: npm run bundle
        working-directory: mobile
      - run: npx cap sync android
        working-directory: mobile
      # A release key from the repository secrets, when there is one; otherwise Gradle falls back to the sideload key.
      - if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"
      - run: ./gradlew assembleRelease --no-daemon -PversionName="${{ needs.version.outputs.version }}" -PversionCode="${{ github.run_number }}"
        working-directory: mobile/android
      - run: cp app/build/outputs/apk/release/app-release.apk "Ultima-III-${{ needs.version.outputs.version }}-android.apk"
        working-directory: mobile/android
      - uses: actions/upload-artifact@v7
        with:
          name: ultima3-android
          path: mobile/android/Ultima-III-*.apk
          if-no-files-found: error

  # One release with every file, made once all four builds exist; the tag is created on this commit.
  release:
    needs: [version, build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      - run: ls -la files
      - run: gh release create "v$VERSION" files/* --title "v$VERSION" --generate-notes --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
