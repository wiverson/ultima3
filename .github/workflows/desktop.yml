# Builds the desktop app (desktop/, Electron) for Windows, macOS and Linux,
# and the Android app (mobile/, Capacitor) as an APK. Every run uploads the
# installers as workflow artifacts. A tag v*, or a manual run with "release"
# ticked, also attaches them to a draft GitHub Release named after the app's
# version. Desktop builds are unsigned: see the README's Desktop section for
# what that means on each platform. The APK is signed with the committed
# sideload key unless the ANDROID_KEYSTORE_* secrets provide a release key.
name: Desktop and Android builds

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Attach the builds to a draft GitHub Release'
        type: boolean
        default: false
      version:
        description: 'Version to build as (blank: the version in desktop/package.json and mobile/package.json)'
        type: string
        default: ''
  push:
    tags: ['v*']
    branches: [main]
    paths: ['desktop/**', 'mobile/**', 'web/**', '.github/workflows/desktop.yml']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - if: ${{ inputs.version != '' }}
        run: npm version --no-git-tag-version "${{ inputs.version }}"
        working-directory: desktop
      - run: npm run bundle
        working-directory: desktop
      - run: npx electron-builder --${{ matrix.target }} --publish ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.release) && 'always' || 'never' }}
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned macOS builds: skip the notarisation step electron-builder would otherwise attempt.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v7
        with:
          name: ultima3-${{ matrix.target }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error

  android:
    # After the desktop matrix, so a release run finds the draft Release electron-builder created.
    needs: build
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: mobile
      - if: ${{ inputs.version != '' }}
        run: npm version --no-git-tag-version "${{ inputs.version }}"
        working-directory: mobile
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: mobile
      - run: npm run bundle
        working-directory: mobile
      - run: npx cap sync android
        working-directory: mobile
      # A release key from the repository secrets, when there is one; otherwise Gradle falls back to the sideload key.
      - if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"
      - run: ./gradlew assembleRelease --no-daemon -PversionName="${{ steps.version.outputs.version }}" -PversionCode="${{ github.run_number }}"
        working-directory: mobile/android
      - run: cp app/build/outputs/apk/release/app-release.apk "Ultima-III-${{ steps.version.outputs.version }}-android.apk"
        working-directory: mobile/android
      - uses: actions/upload-artifact@v7
        with:
          name: ultima3-android
          path: mobile/android/Ultima-III-*.apk
          if-no-files-found: error
      - if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          apk="mobile/android/Ultima-III-${{ steps.version.outputs.version }}-android.apk"
          gh release upload "$tag" "$apk" --clobber || gh release create "$tag" "$apk" --draft --title "$tag"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
