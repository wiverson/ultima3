# Builds the desktop app (desktop/, Electron) for Windows, macOS and Linux.
# Every run uploads the installers as workflow artifacts. A tag v*, or a
# manual run with "release" ticked, also attaches them to a draft GitHub
# Release named after the app's version. Builds are unsigned: see the
# README's Desktop section for what that means on each platform.
name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Attach the builds to a draft GitHub Release'
        type: boolean
        default: false
      version:
        description: 'Version to build as (blank: the version in desktop/package.json)'
        type: string
        default: ''
  push:
    tags: ['v*']
    branches: [main]
    paths: ['desktop/**', 'web/**', '.github/workflows/desktop.yml']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - if: ${{ inputs.version != '' }}
        run: npm version --no-git-tag-version "${{ inputs.version }}"
        working-directory: desktop
      - run: npm run bundle
        working-directory: desktop
      - run: npx electron-builder --${{ matrix.target }} --publish ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.release) && 'always' || 'never' }}
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned macOS builds: skip the notarisation step electron-builder would otherwise attempt.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: ultima3-${{ matrix.target }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error
