<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultima III</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 16px 24px;
      }
      canvas {
        /* Pixel art: never smooth when the browser scales the canvas. */
        image-rendering: pixelated;
        width: 100%;
        max-width: 1280px;
        max-height: 85vh;
        aspect-ratio: 40 / 24;
        outline: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- The game draws everything, loading and error text included, on this canvas. -->
    <canvas id="screen" width="1280" height="768" tabindex="0"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
