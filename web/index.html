<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultima III</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
        color: #c8c8c8;
        font-family: system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 16px 24px;
      }
      canvas {
        /* Pixel art: never smooth when the browser scales the canvas. */
        image-rendering: pixelated;
        width: 100%;
        max-width: 1280px;
        max-height: 85vh;
        aspect-ratio: 40 / 24;
        outline: none;
        display: block;
      }
      #status {
        width: 100%;
        max-width: 1280px;
        margin: 6px 0;
        font-size: 13px;
        color: #f0c060;
        min-height: 1.2em;
      }
      #status a {
        color: #8ec8ff;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" width="1280" height="768" tabindex="0"></canvas>
    <div id="status">Loading...</div>
    <script type="module">
      // Once the game is up, the status line points at the in-game Settings menu.
      const status = document.getElementById('status');
      const observer = new MutationObserver(() => {
        if (status.textContent === '') {
          status.innerHTML = 'Escape opens Settings. The game pauses while the window is not focused. <a href="https://github.com/wiverson/ultima3/blob/main/web/README.md">About this port</a>';
          observer.disconnect();
        }
      });
      observer.observe(status, { childList: true, characterData: true, subtree: true });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
