<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultima III</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 16px 24px;
      }
      canvas {
        /* Pixel art: never smooth when the browser scales the canvas. */
        image-rendering: pixelated;
        /* 40 by 24 cells of square pixels (5:3). The width is whichever is
           least: the page, the native size, or the width that fits 85% of
           the viewport's height; the height follows, so nothing stretches. */
        width: min(100%, 1280px, calc(85vh * 40 / 24));
        aspect-ratio: 40 / 24;
        outline: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- The game draws everything, loading and error text included, on this canvas. -->
    <canvas id="screen" width="1280" height="768" tabindex="0"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
