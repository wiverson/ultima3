<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultima III</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #ccc;
        font-family: system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      canvas {
        /* Pixel art: never smooth when the browser scales the canvas. */
        image-rendering: pixelated;
        max-width: 100vw;
        max-height: calc(100vh - 2em);
        aspect-ratio: 40 / 24;
        outline: none;
      }
      #status {
        height: 2em;
        line-height: 2em;
        font-size: 12px;
        opacity: 0.6;
        white-space: nowrap;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" width="1280" height="768" tabindex="0"></canvas>
    <div id="status">Loading...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
